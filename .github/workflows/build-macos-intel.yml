name: Build Intel macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS package
        run: dart setup.dart macos -v

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: flclash-macos-amd64-${{ github.run_number }}
          path: dist/FlClash-*-macos-amd64.dmg
          if-no-files-found: error
          retention-days: 7
